# CucCut - https://cuccut.coffeesos.online
# Static PWA in /var/www/cuccut.coffeesos.online + AI proxy (cuccut-ai.service) on 127.0.0.1:7820
limit_req_zone $binary_remote_addr zone=cuccut_ai:10m rate=12r/m;

upstream cuccut_ai { server 127.0.0.1:7820; keepalive 8; }

server {
    server_name cuccut.coffeesos.online;

    root /var/www/cuccut.coffeesos.online;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ai/ {
        limit_req zone=cuccut_ai burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 25m;
        proxy_request_buffering on;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://cuccut_ai;
    }

    # Content-hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker + manifest must always be revalidated
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA shell: never cache so a new build is picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(self), microphone=(self)";

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/cuccut.coffeesos.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuccut.coffeesos.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cuccut.coffeesos.online;
    return 301 https://$host$request_uri;
}
